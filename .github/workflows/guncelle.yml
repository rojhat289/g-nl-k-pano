name: Günlük güncelleme

on:
  schedule:
    - cron: "0 13 * * *"   # her gün 13:00 UTC = 16:00 Türkiye saati
  workflow_dispatch:        # Actions sekmesinden elle çalıştırma düğmesi

permissions:
  contents: write

jobs:
  guncelle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verileri topla
        run: python collect.py
      - name: Sonuçları kaydet
        run: |
          git config user.name "pano-bot"
          git config user.email "pano-bot@users.noreply.github.com"
          git add data
          git diff --staged --quiet || git commit -m "Günlük veri $(date +%F)"
          git push
